pre-commit:
  parallel: true
  commands:
    lint:
      run: yarn lint
    typecheck:
      run: yarn typecheck
    test:
      run: yarn test:ci
    docs-drift:
      run: yarn generated-docs:sync

pre-push:
  commands:
    test:
      run: yarn test:ci

post-commit:
  commands:
    generated-docs-check:
      run: yarn generated-docs:check && yarn build

commit-msg:
  scripts:
    validate-conventional-commit.sh:
      runner: sh
