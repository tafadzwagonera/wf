pre-commit:
  parallel: true
  skip: [rebase, merge]
  jobs:
    - name: lint
      run: yarn lint
    - name: typecheck
      run: yarn typecheck
    - name: test
      run: yarn test:ci
    - name: generated-docs
      group:
        piped: true
        jobs:
          - name: docs-drift
            run: yarn sync:generated-docs
          - name: build
            run: yarn build && chmod +x dist/main.js

pre-push:
  commands:
    test:
      run: yarn test:ci

post-commit:
  skip: [rebase, merge]
  commands:
    generated-docs-check:
      run: yarn generated-docs:check

commit-msg:
  scripts:
    validate-conventional-commit.sh:
      runner: sh
